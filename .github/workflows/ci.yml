name: CI

on:
  push:
    branches: [devel]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Install Kinmokusei
        run: go install github.com/puffball1567/kinmokusei/cmd/keika@v0.4.3
      - name: Test
        run: VASEST_RACE=1 KEIKA="$(go env GOPATH)/bin/keika" sh scripts/test.sh

  required:
    name: Required compatibility
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform test
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
