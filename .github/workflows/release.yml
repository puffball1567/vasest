name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the release ref
        run: |
          set -eu
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::Run this workflow from a version tag."; exit 1 ;;
          esac
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Install Kinmokusei
        run: go install github.com/puffball1567/kinmokusei/cmd/keika@v0.4.3
      - name: Build and verify CLI archives
        run: KEIKA="$(go env GOPATH)/bin/keika" sh scripts/package-release.sh "$GITHUB_REF_NAME" dist
      - uses: actions/upload-artifact@v4
        with:
          name: vasest-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "Vasest $GITHUB_REF_NAME" --notes-file "release/$GITHUB_REF_NAME.md"
